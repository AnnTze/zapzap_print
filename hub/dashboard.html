<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZapZap · Booths</title>
<style>
  :root {
    --ground: #FBFAFC; --surface: #FFFFFF; --surface-2: #F1EDF4;
    --rule: #DFD8E4; --ink: #17141A; --muted: #6A6172;
    --accent: #A8005C; --ok: #1B7F4B; --wait: #A66A00; --bad: #B3261E;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131116; --surface: #1B1820; --surface-2: #241F2B;
      --rule: #302A38; --ink: #ECE8F0; --muted: #9B92A4;
      --accent: #FF5AA6; --ok: #4BC98A; --wait: #E0A53A; --bad: #F0837A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--mono); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 48px;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--ground); border-bottom: 1px solid var(--rule);
    padding: 18px 22px; display: flex; justify-content: space-between;
    align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .meta { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
  main {
    padding: 22px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    max-width: 1400px; margin: 0 auto;
  }
  .card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .card.off { opacity: .72; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .event { font-size: 11px; color: var(--muted); }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .on { color: var(--ok); } .off-c { color: var(--bad); } .warn { color: var(--wait); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .m span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .m b { font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .barrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); }
  .bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .bar i.low { background: var(--bad); }
  .bar i.mid { background: var(--wait); }
  .val { font-variant-numeric: tabular-nums; color: var(--ink); }
  .pause { font-size: 11.5px; color: var(--wait); border-top: 1px dashed var(--rule); padding-top: 10px; }
  .queue { font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 10px; }
  .queue ul { margin: 6px 0 0; padding-left: 16px; }
  .wm { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 10px; }
  .wm img { width: 26px; height: 26px; object-fit: contain; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface-2); }

  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 32px 22px 0; max-width: 1400px; }
  .events { padding: 12px 22px 0; max-width: 1400px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .ev { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .drop {
    border: 2px dashed var(--rule); border-radius: 5px; padding: 22px 16px;
    text-align: center; color: var(--muted); font-size: 12px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: var(--surface-2); color: var(--ink); }
  .drop b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  .preview { position: relative; border-radius: 4px; overflow: hidden; aspect-ratio: 3 / 2;
             background: linear-gradient(135deg, #8a94a6, #cfd6e0 55%, #9aa7b4); }
  .preview img { position: absolute; }
  .ctrls { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 11px; color: var(--muted); }
  .ctrls input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctrls select { font-family: var(--mono); font-size: 11px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; grid-column: 2 / -1; }
  .rowbtns { display: flex; gap: 8px; }
  button {
    font-family: var(--mono); font-size: 11.5px; padding: 7px 14px; cursor: pointer;
    border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.ghost { background: none; color: var(--muted); border-color: var(--rule); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 11.5px; min-height: 1.2em; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 60px 20px; line-height: 1.8; }
  .empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 3px; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>ZapZap · Booths</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<main id="cards"></main>
<h2>Events &amp; watermarks</h2>
<section class="events" id="events"></section>

<script>
const REFRESH_MS = 3000;

function ago(sec) {
  if (sec === null || sec === undefined) return "never";
  if (sec < 60) return Math.round(sec) + "s ago";
  if (sec < 3600) return Math.round(sec / 60) + "m ago";
  return Math.round(sec / 3600) + "h ago";
}

function bar(label, remaining, total) {
  if (remaining === undefined || remaining === null || !total) return "";
  const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
  const cls = pct <= 10 ? "low" : pct <= 30 ? "mid" : "";
  return `<div class="barrow"><span>${label}</span>
    <span class="bar"><i class="${cls}" style="width:${pct}%"></i></span>
    <span class="val">${remaining}/${total}</span></div>`;
}

function card(p) {
  const s = p.status || {};
  let state = "on", label = "online";
  if (!p.online) { state = "off-c"; label = "offline " + ago(p.seconds_since_seen); }
  else if (s.paused) { state = "warn"; label = "paused"; }
  else if (s.printer_ready === false) { state = "warn"; label = "printer down"; }

  const q = Array.isArray(s.queue) ? s.queue : [];
  return `<div class="card ${p.online ? "" : "off"}">
    <div class="top">
      <div><div class="name">${esc(p.name)}</div>
        <div class="event">${p.event_name ? esc(p.event_name) : "no event assigned"}</div></div>
      <span class="dot ${state}">${esc(label)}</span>
    </div>
    <div class="grid">
      <div class="m"><span>Prints today</span><b>${s.prints_today ?? "—"}</b></div>
      <div class="m"><span>Queue</span><b>${s.queue_depth ?? "—"}</b></div>
    </div>
    <div class="bars">
      ${bar("Ribbon", s.ribbon_remaining, s.ribbon_capacity)}
      ${bar("Paper", s.paper_remaining, s.paper_loaded)}
    </div>
    ${s.paused ? `<div class="pause">${s.pause_auto ? "Auto-paused" : "Paused"} — ${esc(s.pause_reason || "")}</div>` : ""}
    ${q.length ? `<div class="queue">In queue:<ul>${q.slice(0, 4).map(j =>
        `<li>${esc(j.title || j.id || "job")}</li>`).join("")}</ul></div>` : ""}
    <div class="wm">${p.watermark_filename
        ? `<img src="/assets/${esc(p.watermark_asset)}" alt=""> ${esc(p.watermark_filename)}`
        : "watermark: booth's own .env"}</div>
  </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function tick() {
  try {
    const r = await fetch("/api/printers", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const list = data.printers || [];
    const online = list.filter(p => p.online).length;
    document.getElementById("meta").textContent =
      list.length ? `${list.length} printer${list.length === 1 ? "" : "s"} · ${online} online · refreshed just now`
                  : "no printers registered";
    document.getElementById("cards").innerHTML = list.length
      ? list.map(card).join("")
      : `<div class="empty">No booths registered yet.<br><br>
         On the hub, run <code>python -m hub.main add-printer "Booth A"</code><br>
         then put the printed keys in that Mac's <code>.env</code>.</div>`;
  } catch (e) {
    document.getElementById("meta").textContent = "hub unreachable — " + e.message;
  }
}

// --- Events & watermarks -----------------------------------------------
// Local edits are held here so a 3s refresh of the printer cards never yanks
// a slider out from under you mid-drag.
const draft = {};

const DEFAULTS = { opacity: 0.35, scale: 0.6, margin: 0.05, position: "bottom-right" };

function d(ev) {
  if (!draft[ev.id]) {
    draft[ev.id] = {
      sha256: ev.watermark_asset || null,
      filename: ev.watermark_filename || null,
      opacity: ev.wm_opacity ?? DEFAULTS.opacity,
      scale: ev.wm_scale ?? DEFAULTS.scale,
      margin: ev.wm_margin ?? DEFAULTS.margin,
      position: ev.wm_position || DEFAULTS.position,
    };
  }
  return draft[ev.id];
}

// Mirrors bot.py's apply_watermark: scale is a fraction of the SHORTER canvas
// side applied to the logo's longer edge, margin is a fraction of each axis.
function placeStyle(st, boxW, boxH) {
  const shorter = Math.min(boxW, boxH);
  const size = shorter * st.scale;
  const mx = boxW * st.margin, my = boxH * st.margin;
  let css = `max-width:${size}px;max-height:${size}px;opacity:${Math.min(1, st.opacity)};`;
  switch (st.position) {
    case "top-left":     return css + `left:${mx}px;top:${my}px;`;
    case "top-right":    return css + `right:${mx}px;top:${my}px;`;
    case "bottom-left":  return css + `left:${mx}px;bottom:${my}px;`;
    case "center":       return css + `left:50%;top:50%;transform:translate(-50%,-50%);`;
    default:             return css + `right:${mx}px;bottom:${my}px;`;
  }
}

function eventCard(ev) {
  const st = d(ev);
  const n = ev.printer_count || 0;
  return `<div class="ev" data-ev="${esc(ev.id)}">
    <div class="top">
      <div><div class="name">${esc(ev.name)}</div>
        <div class="event">${n} printer${n === 1 ? "" : "s"} assigned</div></div>
    </div>
    <div class="drop" data-drop>
      <b>${st.filename ? esc(st.filename) : "Drop a PNG here"}</b>
      ${st.filename ? "click or drop to replace" : "or click to choose a file"}
    </div>
    <div class="preview" data-preview>
      ${st.sha256 ? `<img src="/assets/${esc(st.sha256)}" alt="" data-mark>` : ""}
    </div>
    <div class="ctrls">
      <span>Size</span><input type="range" data-k="scale" min="0.05" max="1" step="0.05" value="${st.scale}"><span data-v="scale">${st.scale}</span>
      <span>Opacity</span><input type="range" data-k="opacity" min="0" max="1" step="0.05" value="${Math.min(1, st.opacity)}"><span data-v="opacity">${st.opacity}</span>
      <span>Margin</span><input type="range" data-k="margin" min="0" max="0.25" step="0.01" value="${st.margin}"><span data-v="margin">${st.margin}</span>
      <span>Position</span>
      <select data-k="position">
        ${["bottom-right","bottom-left","top-right","top-left","center"].map(o =>
          `<option value="${o}" ${o === st.position ? "selected" : ""}>${o}</option>`).join("")}
      </select>
    </div>
    <div class="rowbtns">
      <button data-save ${st.sha256 ? "" : "disabled"}>Apply to booths</button>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <div class="msg" data-msg></div>
  </div>`;
}

function repositionMark(el) {
  const st = draft[el.dataset.ev];
  const box = el.querySelector("[data-preview]");
  const mark = el.querySelector("[data-mark]");
  if (!mark || !box) return;
  mark.style.cssText = placeStyle(st, box.clientWidth, box.clientHeight);
}

function wireEvent(el, ev) {
  const id = el.dataset.ev;
  const st = draft[id];
  const msg = el.querySelector("[data-msg]");
  const drop = el.querySelector("[data-drop]");

  const say = (text, cls) => { msg.textContent = text; msg.className = "msg " + (cls || ""); };

  async function upload(file) {
    if (!file) return;
    say("Uploading…");
    const fd = new FormData();
    fd.append("file", file);
    try {
      const r = await fetch("/api/assets", { method: "POST", body: fd });
      const body = await r.json();
      if (!r.ok) return say(body.error || "Upload failed", "err");
      st.sha256 = body.sha256;
      st.filename = body.filename;
      say("Uploaded. Press Apply to send it to the booths.", "ok");
      renderEvents(lastEvents, id);
    } catch (e) { say("Upload failed: " + e.message, "err"); }
  }

  drop.addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/png";
    inp.onchange = () => upload(inp.files[0]);
    inp.click();
  });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove("over");
  }));
  drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

  el.querySelectorAll("[data-k]").forEach(input => {
    input.addEventListener("input", () => {
      const k = input.dataset.k;
      st[k] = k === "position" ? input.value : parseFloat(input.value);
      const out = el.querySelector(`[data-v="${k}"]`);
      if (out) out.textContent = st[k];
      repositionMark(el);
    });
  });

  el.querySelector("[data-save]").addEventListener("click", async () => {
    say("Applying…");
    try {
      const r = await fetch(`/api/events/${id}/watermark`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(st),
      });
      const body = await r.json();
      if (!r.ok) return say(body.error || "Failed", "err");
      say("Applied. Booths pick it up within 10 seconds.", "ok");
    } catch (e) { say("Failed: " + e.message, "err"); }
  });

  el.querySelector("[data-clear]").addEventListener("click", async () => {
    say("Clearing…");
    try {
      const r = await fetch(`/api/events/${id}/watermark`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sha256: null }),
      });
      if (!r.ok) return say("Failed", "err");
      delete draft[id];
      say("Cleared. Booths fall back to their own .env watermark.", "ok");
      loadEvents();
    } catch (e) { say("Failed: " + e.message, "err"); }
  });

  repositionMark(el);
  const mark = el.querySelector("[data-mark]");
  if (mark) mark.addEventListener("load", () => repositionMark(el));
}

let lastEvents = [];
function renderEvents(events, focusId) {
  lastEvents = events;
  const host = document.getElementById("events");
  if (!events.length) {
    host.innerHTML = `<div class="empty">No events yet.<br><br>
      On the hub, run <code>python -m hub.main add-event "Sarah &amp; Tom"</code>
      then <code>assign</code> a printer to it.</div>`;
    return;
  }
  host.innerHTML = events.map(eventCard).join("");
  host.querySelectorAll(".ev").forEach((el, i) => wireEvent(el, events[i]));
}

async function loadEvents() {
  try {
    const r = await fetch("/api/events", { cache: "no-store" });
    const data = await r.json();
    renderEvents(data.events || []);
  } catch (e) { /* dashboard header already reports hub trouble */ }
}

window.addEventListener("resize", () =>
  document.querySelectorAll(".ev").forEach(repositionMark));

tick();
setInterval(tick, REFRESH_MS);
loadEvents();
</script>
</body>
</html>
