<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ZapZap · Booths</title>
<style>
  :root {
    /* Apple system palette, light: grouped background with white cards. */
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --card-2: #F2F2F7;
    --separator: rgba(60, 60, 67, .29);
    --label: #000000;
    --label-2: rgba(60, 60, 67, .60);
    --label-3: rgba(60, 60, 67, .30);
    --blue: #007AFF;
    --green: #34C759;
    --orange: #FF9500;
    --red: #FF3B30;
    --fill: rgba(120, 120, 128, .16);
    --header-bg: rgba(242, 242, 247, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);

    --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card-2: #2C2C2E;
      --separator: rgba(84, 84, 88, .65);
      --label: #FFFFFF;
      --label-2: rgba(235, 235, 245, .60);
      --label-3: rgba(235, 235, 245, .30);
      --blue: #0A84FF;
      --green: #30D158;
      --orange: #FF9F0A;
      --red: #FF453A;
      --fill: rgba(120, 120, 128, .36);
      --header-bg: rgba(0, 0, 0, .78);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: var(--text);
    font-size: 17px;
    line-height: 1.45;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 max(48px, env(safe-area-inset-bottom));
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--separator);
    padding: 14px 20px 12px;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  h1 { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; }
  .meta { margin-top: 2px; font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }

  main, .events { max-width: 1100px; margin: 0 auto; padding: 20px; }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  .card {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .card.off { opacity: .6; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .name { font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
  .event { font-size: 13px; color: var(--label-2); margin-top: 1px; }

  .pill {
    flex: none; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 100px; white-space: nowrap;
    background: var(--fill); color: var(--label-2);
  }
  .pill.on   { color: var(--green);  background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pill.warn { color: var(--orange); background: color-mix(in srgb, var(--orange) 16%, transparent); }
  .pill.bad  { color: var(--red);    background: color-mix(in srgb, var(--red) 14%, transparent); }

  .stats { display: flex; gap: 28px; }
  .stat span { display: block; font-size: 12px; font-weight: 500; color: var(--label-2); }
  .stat b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }

  .bars { display: flex; flex-direction: column; gap: 11px; }
  .barrow { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: center; }
  .barrow > span:first-child { font-size: 13px; color: var(--label-2); }
  .bar { height: 6px; border-radius: 100px; background: var(--fill); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 100px; background: var(--green); transition: width .5s cubic-bezier(.4, 0, .2, 1); }
  .bar i.mid { background: var(--orange); }
  .bar i.low { background: var(--red); }
  .val { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }

  .inset { background: var(--card-2); border-radius: 10px; padding: 11px 13px; font-size: 13px; line-height: 1.4; }
  .inset.warn { color: var(--orange); }
  .inset .h { color: var(--label-2); margin-bottom: 5px; }
  .inset ul { margin: 0; padding-left: 17px; font-family: var(--mono); font-size: 11.5px; color: var(--label-2); }
  .wm { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--label-2); }
  .wm img { width: 30px; height: 30px; object-fit: contain; flex: none; border-radius: 7px; background: var(--fill); }

  h2 { max-width: 1100px; margin: 26px auto 0; padding: 0 20px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .events { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); padding-top: 12px; }
  .ev { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 15px; }

  .drop {
    border: 1.5px dashed var(--label-3); border-radius: 12px;
    padding: 20px 16px; text-align: center; cursor: pointer;
    font-size: 13px; color: var(--label-2); transition: border-color .2s, background .2s;
  }
  .drop.over { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 8%, transparent); }
  .drop b { display: block; font-size: 15px; font-weight: 500; color: var(--label); margin-bottom: 3px; }

  .preview { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 2;
             background: linear-gradient(150deg, #5B6B8C, #A9B4C4 52%, #8C7F6E); }
  .preview img { position: absolute; }

  .ctrls { display: grid; grid-template-columns: 66px 1fr 46px; gap: 12px; align-items: center; font-size: 13px; color: var(--label-2); }
  .ctrls input[type=range] { width: 100%; accent-color: var(--blue); }
  .ctrls .num { text-align: right; font-variant-numeric: tabular-nums; }
  .ctrls select { grid-column: 2 / -1; font-family: inherit; font-size: 14px; background: var(--card-2);
                  color: var(--label); border: none; border-radius: 8px; padding: 7px 10px; }

  .rowbtns { display: flex; gap: 10px; }
  button { font-family: inherit; font-size: 15px; font-weight: 500; padding: 10px 18px;
           border-radius: 100px; border: none; cursor: pointer; background: var(--blue); color: #fff; transition: opacity .15s; }
  button:active { opacity: .7; }
  button.ghost { background: var(--fill); color: var(--label); }
  button:disabled { opacity: .4; cursor: default; }

  .msg { font-size: 13px; min-height: 1.3em; color: var(--label-2); }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }

  .empty { grid-column: 1 / -1; text-align: center; padding: 56px 24px; color: var(--label-2); font-size: 15px; line-height: 1.6; }
  .empty code { font-family: var(--mono); font-size: 13px; color: var(--label); }

  @media (max-width: 500px) {
    h1 { font-size: 30px; }
    main, .events { padding: 16px; gap: 14px; grid-template-columns: 1fr; }
    h2 { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Booths</h1>
  <div class="meta" id="meta">Connecting…</div>
</header>
<main id="cards"></main>
<h2>Events &amp; Watermarks</h2>
<section class="events" id="events"></section>

<script>
const REFRESH_MS = 3000;

function ago(sec) {
  if (sec === null || sec === undefined) return "never";
  if (sec < 60) return Math.round(sec) + "s ago";
  if (sec < 3600) return Math.round(sec / 60) + "m ago";
  return Math.round(sec / 3600) + "h ago";
}

function bar(label, remaining, total) {
  if (remaining === undefined || remaining === null || !total) return "";
  const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
  const cls = pct <= 10 ? "low" : pct <= 30 ? "mid" : "";
  return `<div class="barrow"><span>${label}</span>
    <span class="bar"><i class="${cls}" style="width:${pct}%"></i></span>
    <span class="val">${remaining}/${total}</span></div>`;
}

function card(p) {
  const s = p.status || {};
  let state = "on", label = "Online";
  if (!p.online) { state = "bad"; label = "Offline " + ago(p.seconds_since_seen); }
  else if (s.paused) { state = "warn"; label = "Paused"; }
  else if (s.printer_ready === false) { state = "warn"; label = "Printer down"; }

  const q = Array.isArray(s.queue) ? s.queue : [];
  return `<div class="card ${p.online ? "" : "off"}">
    <div class="top">
      <div><div class="name">${esc(p.name)}</div>
        <div class="event">${p.event_name ? esc(p.event_name) : "No event assigned"}</div></div>
      <span class="pill ${state}">${esc(label)}</span>
    </div>
    <div class="stats">
      <div class="stat"><b>${s.prints_today ?? "—"}</b><span>Prints today</span></div>
      <div class="stat"><b>${s.queue_depth ?? "—"}</b><span>In queue</span></div>
    </div>
    <div class="bars">
      ${bar("Ribbon", s.ribbon_remaining, s.ribbon_capacity)}
      ${bar("Paper", s.paper_remaining, s.paper_loaded)}
    </div>
    ${s.paused ? `<div class="inset warn">${s.pause_auto ? "Auto-paused" : "Paused"} — ${esc(s.pause_reason || "")}</div>` : ""}
    ${q.length ? `<div class="inset"><div class="h">In queue</div><ul>${q.slice(0, 4).map(j =>
        `<li>${esc(j.title || j.id || "job")}</li>`).join("")}</ul></div>` : ""}
    <div class="wm">${p.watermark_filename
        ? `<img src="/assets/${esc(p.watermark_asset)}" alt=""> ${esc(p.watermark_filename)}`
        : "Watermark from booth's own .env"}</div>
  </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function tick() {
  try {
    const r = await fetch("/api/printers", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const list = data.printers || [];
    const online = list.filter(p => p.online).length;
    document.getElementById("meta").textContent =
      list.length ? `${list.length} printer${list.length === 1 ? "" : "s"} · ${online} online · updated just now`
                  : "No printers registered";
    document.getElementById("cards").innerHTML = list.length
      ? list.map(card).join("")
      : `<div class="empty">No booths registered yet.<br><br>
         On the hub, run <code>python -m hub.main add-printer "Booth A"</code><br>
         then put the printed key in that machine's <code>.env</code>.</div>`;
  } catch (e) {
    document.getElementById("meta").textContent = "hub unreachable — " + e.message;
  }
}

// --- Events & watermarks -----------------------------------------------
// Local edits are held here so a 3s refresh of the printer cards never yanks
// a slider out from under you mid-drag.
const draft = {};

const DEFAULTS = { opacity: 0.35, scale: 0.6, margin: 0.05, position: "bottom-right" };

function d(ev) {
  if (!draft[ev.id]) {
    draft[ev.id] = {
      sha256: ev.watermark_asset || null,
      filename: ev.watermark_filename || null,
      opacity: ev.wm_opacity ?? DEFAULTS.opacity,
      scale: ev.wm_scale ?? DEFAULTS.scale,
      margin: ev.wm_margin ?? DEFAULTS.margin,
      position: ev.wm_position || DEFAULTS.position,
    };
  }
  return draft[ev.id];
}

// Mirrors bot.py's apply_watermark: scale is a fraction of the SHORTER canvas
// side applied to the logo's longer edge, margin is a fraction of each axis.
function placeStyle(st, boxW, boxH) {
  const shorter = Math.min(boxW, boxH);
  const size = shorter * st.scale;
  const mx = boxW * st.margin, my = boxH * st.margin;
  let css = `max-width:${size}px;max-height:${size}px;opacity:${Math.min(1, st.opacity)};`;
  switch (st.position) {
    case "top-left":     return css + `left:${mx}px;top:${my}px;`;
    case "top-right":    return css + `right:${mx}px;top:${my}px;`;
    case "bottom-left":  return css + `left:${mx}px;bottom:${my}px;`;
    case "center":       return css + `left:50%;top:50%;transform:translate(-50%,-50%);`;
    default:             return css + `right:${mx}px;bottom:${my}px;`;
  }
}

function eventCard(ev) {
  const st = d(ev);
  const n = ev.printer_count || 0;
  return `<div class="ev" data-ev="${esc(ev.id)}">
    <div class="top">
      <div><div class="name">${esc(ev.name)}</div>
        <div class="event">${n} printer${n === 1 ? "" : "s"} assigned</div></div>
    </div>
    <div class="drop" data-drop>
      <b>${st.filename ? esc(st.filename) : "Drop a PNG here"}</b>
      ${st.filename ? "Click or drop to replace" : "Or click to choose a file"}
    </div>
    <div class="preview" data-preview>
      ${st.sha256 ? `<img src="/assets/${esc(st.sha256)}" alt="" data-mark>` : ""}
    </div>
    <div class="ctrls">
      <span>Size</span><input type="range" data-k="scale" min="0.05" max="1" step="0.05" value="${st.scale}"><span class="num" data-v="scale">${st.scale}</span>
      <span>Opacity</span><input type="range" data-k="opacity" min="0" max="1" step="0.05" value="${Math.min(1, st.opacity)}"><span class="num" data-v="opacity">${st.opacity}</span>
      <span>Margin</span><input type="range" data-k="margin" min="0" max="0.25" step="0.01" value="${st.margin}"><span class="num" data-v="margin">${st.margin}</span>
      <span>Position</span>
      <select data-k="position">
        ${["bottom-right","bottom-left","top-right","top-left","center"].map(o =>
          `<option value="${o}" ${o === st.position ? "selected" : ""}>${o}</option>`).join("")}
      </select>
    </div>
    <div class="rowbtns">
      <button data-save ${st.sha256 ? "" : "disabled"}>Apply to booths</button>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <div class="msg" data-msg></div>
  </div>`;
}

function repositionMark(el) {
  const st = draft[el.dataset.ev];
  const box = el.querySelector("[data-preview]");
  const mark = el.querySelector("[data-mark]");
  if (!mark || !box) return;
  mark.style.cssText = placeStyle(st, box.clientWidth, box.clientHeight);
}

function wireEvent(el, ev) {
  const id = el.dataset.ev;
  const st = draft[id];
  const msg = el.querySelector("[data-msg]");
  const drop = el.querySelector("[data-drop]");

  const say = (text, cls) => { msg.textContent = text; msg.className = "msg " + (cls || ""); };

  async function upload(file) {
    if (!file) return;
    say("Uploading…");
    const fd = new FormData();
    fd.append("file", file);
    try {
      const r = await fetch("/api/assets", { method: "POST", body: fd });
      const body = await r.json();
      if (!r.ok) return say(body.error || "Upload failed", "err");
      st.sha256 = body.sha256;
      st.filename = body.filename;
      say("Uploaded. Press Apply to send it to the booths.", "ok");
      renderEvents(lastEvents, id);
    } catch (e) { say("Upload failed: " + e.message, "err"); }
  }

  drop.addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/png";
    inp.onchange = () => upload(inp.files[0]);
    inp.click();
  });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove("over");
  }));
  drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

  el.querySelectorAll("[data-k]").forEach(input => {
    input.addEventListener("input", () => {
      const k = input.dataset.k;
      st[k] = k === "position" ? input.value : parseFloat(input.value);
      const out = el.querySelector(`[data-v="${k}"]`);
      if (out) out.textContent = st[k];
      repositionMark(el);
    });
  });

  el.querySelector("[data-save]").addEventListener("click", async () => {
    say("Applying…");
    try {
      const r = await fetch(`/api/events/${id}/watermark`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(st),
      });
      const body = await r.json();
      if (!r.ok) return say(body.error || "Failed", "err");
      say("Applied. Booths pick it up within 10 seconds.", "ok");
    } catch (e) { say("Failed: " + e.message, "err"); }
  });

  el.querySelector("[data-clear]").addEventListener("click", async () => {
    say("Clearing…");
    try {
      const r = await fetch(`/api/events/${id}/watermark`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sha256: null }),
      });
      if (!r.ok) return say("Failed", "err");
      delete draft[id];
      say("Cleared. Booths fall back to their own .env watermark.", "ok");
      loadEvents();
    } catch (e) { say("Failed: " + e.message, "err"); }
  });

  repositionMark(el);
  const mark = el.querySelector("[data-mark]");
  if (mark) mark.addEventListener("load", () => repositionMark(el));
}

let lastEvents = [];
function renderEvents(events, focusId) {
  lastEvents = events;
  const host = document.getElementById("events");
  if (!events.length) {
    host.innerHTML = `<div class="empty">No events yet.<br><br>
      On the hub, run <code>python -m hub.main add-event "Sarah &amp; Tom"</code>
      then <code>assign</code> a printer to it.</div>`;
    return;
  }
  host.innerHTML = events.map(eventCard).join("");
  host.querySelectorAll(".ev").forEach((el, i) => wireEvent(el, events[i]));
}

async function loadEvents() {
  try {
    const r = await fetch("/api/events", { cache: "no-store" });
    const data = await r.json();
    renderEvents(data.events || []);
  } catch (e) { /* dashboard header already reports hub trouble */ }
}

window.addEventListener("resize", () =>
  document.querySelectorAll(".ev").forEach(repositionMark));

tick();
setInterval(tick, REFRESH_MS);
loadEvents();
</script>
</body>
</html>
